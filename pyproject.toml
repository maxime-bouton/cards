[project]
authors = [{name = "Stéphane Despierres", email = "stephane.despierres@centralelille.fr"}, {name = "Pierre-Antoine Thouvenin", email = "pierreantoine.thouvenin@centrale.fr"}]
description = "Add a short description here"
name = "mcmc"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [ "sphinxcontrib-apa>=1.0.0,<2", "sphinx-copybutton>=0.5.2,<0.6", "docstr-coverage>=2.3.2,<3", "genbadge>=1.1.2,<2", "wily>=1.25.0,<2", "torch>=2.7.0,<3", "torchvision>=0.22.0,<0.23"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
mcmc = { path = ".", editable = true }

[tool.pixi.tasks]
setup_test = "mpirun -x OMPI_MCA_pml=ucx -x OMPI_MCA_osc=ucx -x OMPI_MCA_opal_cuda_support=true -x UCX_MEMTYPE_CACHE=n -np 2 python test.py"

[tool.pixi.dependencies]
python = "3.13.*"
cupy = ">=13.4.1,<14"
mpi4py = ">=4.0.3,<5"
h5py = { version = ">=3.13.0,<4", build = "mpi*" }
ruff = ">=0.11.8,<0.12"
pre-commit = ">=4.2.0,<5"
pytest = ">=8.3.5,<9"
mypy = ">=1.15.0,<2"
ipykernel = ">=6.29.5,<7"
mpi = { version = ">=1.0,<2", build = "openmpi" }
scipy = ">=1.15.2,<2"
tqdm = ">=4.67.1,<5"
matplotlib = ">=3.10.1,<4"
scikit-image = ">=0.25.2,<0.26"
coverage = ">=7.8.0,<8"
furo = ">=2024.8.6,<2025"
sphinx = ">=8.2.3,<9"
sphinx_rtd_theme = ">=3.0.1,<4"
sphinxcontrib-bibtex = ">=2.6.3,<3"
sphinx-autoapi = ">=3.5.0,<4"
sphinx-design = ">=0.6.1,<0.7"

[dependency-groups]
test = ["pytest"]
docs = ["sphinx"]
dev = [{include-group = "test"}, {include-group = "docs"}]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "mpi: parallel tests requiring mpi",
    "numpy: tests relying on torch as a computing backend",
    "torch: tests relying on numpy as a computing backend",
]
addopts = "-ra -q -vv"
testpaths = "tests"
